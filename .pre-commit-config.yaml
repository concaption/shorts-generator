repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
    -   id: black
        exclude: ^dist/
-   repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
    -   id: isort
